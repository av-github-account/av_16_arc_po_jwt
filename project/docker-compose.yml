version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  auth_service:
    build: ./auth_service
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/app
      SECRET_KEY: supersecretkey
    ports:
      - "8001:8000"
    depends_on:
      - db

  post_service:
    build: ./post_service
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/app
      SECRET_KEY: supersecretkey
    ports:
      - "8002:8000"
    depends_on:
      - db
